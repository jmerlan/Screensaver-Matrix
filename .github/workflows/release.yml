name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Check tag matches project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content MatrixScreensaver.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in MatrixScreensaver.csproj" }

      - name: Build screensaver and installer
        shell: pwsh
        run: ./build.ps1 -Installer

      - name: Compute checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/Matrix.scr, dist/MatrixScreensaverSetup-*.exe |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist/Matrix.scr, dist/MatrixScreensaverSetup-*.exe, dist/SHA256SUMS.txt).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Matrix Screensaver $env:GITHUB_REF_NAME" --generate-notes
